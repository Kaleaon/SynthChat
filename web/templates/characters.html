{% extends "base.html" %}

{% block title %}Characters - SynthChat{% endblock %}

{% block body %}
<div class="characters-page">
    <header class="page-header">
        <div class="header-left">
            <a href="/chat" class="btn btn-icon">
                <span class="material-icons">arrow_back</span>
            </a>
            <h1>My Characters</h1>
        </div>
        <div class="header-right">
            <button class="btn btn-primary" id="create-character-btn">
                <span class="material-icons">add</span>
                Create Character
            </button>
        </div>
    </header>
    
    <main class="page-content">
        <div class="characters-grid" id="characters-grid">
            <!-- Character cards will be loaded here -->
        </div>
        
        <div class="empty-state" id="empty-characters" style="display: none;">
            <span class="material-icons">person_add</span>
            <h2>No characters yet</h2>
            <p>Create your first character to start chatting!</p>
            <button class="btn btn-primary" id="create-first-btn">
                <span class="material-icons">add</span>
                Create Character
            </button>
        </div>
    </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    await loadCharacters();
    
    document.getElementById('create-character-btn').addEventListener('click', () => {
        window.location.href = '/chat#create';
    });
    
    document.getElementById('create-first-btn')?.addEventListener('click', () => {
        window.location.href = '/chat#create';
    });
});

async function loadCharacters() {
    try {
        const response = await fetch('/api/characters');
        const data = await response.json();
        
        const grid = document.getElementById('characters-grid');
        const empty = document.getElementById('empty-characters');
        
        if (data.characters.length === 0) {
            grid.style.display = 'none';
            empty.style.display = 'flex';
            return;
        }
        
        grid.innerHTML = data.characters.map(char => `
            <div class="character-card-large" onclick="window.location.href='/chat#char-${char.id}'">
                <img src="${char.avatar_url}" alt="${char.name}" class="avatar-xl">
                <div class="card-content">
                    <h3>${char.name}</h3>
                    <p class="description">${char.description || char.personality || 'No description'}</p>
                    <div class="card-meta">
                        <span><span class="material-icons">chat</span> ${char.conversation_count} chats</span>
                        <span><span class="material-icons">psychology</span> ${Object.keys(char.traits || {}).length} traits</span>
                    </div>
                    ${char.drive_connected ? '<span class="badge badge-success"><span class="material-icons">cloud_done</span> Drive Connected</span>' : ''}
                </div>
            </div>
        `).join('');
        
    } catch (err) {
        console.error('Error loading characters:', err);
    }
}
</script>
{% endblock %}
